name: Plugin Check

# Prueft die WordPress.org-Fassung mit dem offiziellen Plugin Check
# (dasselbe Werkzeug, das das Plugin-Review-Team einsetzt) und
# kompiliert jede PHP-Datei einmal mit `php -l`.

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: PHP-Syntax (php -l)
        run: |
          fehler=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null || { php -l "$f"; fehler=1; }
          done < <(git ls-files '*.php')
          exit $fehler

      - name: WordPress.org-Fassung bauen
        run: |
          mkdir -p build/easycheckout
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' \
                --exclude='node_modules' --exclude='*.zip' \
                --exclude='.wordpress-org' \
                --exclude='.gitignore' \
                --exclude='includes/class-updater.php' \
                --exclude='languages/*.po' --exclude='languages/*.mo' \
                --exclude='API-REFERENCE.md' \
                --exclude='INSTALL-UND-NUTZUNG.md' \
                --exclude='PUBLISHING.md' \
                --exclude='HANDBUCH.md' \
                ./ build/easycheckout/

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/easycheckout'
